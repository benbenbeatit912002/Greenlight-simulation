[project]
name = "greenlight-2-simulator"
version = "0.2.0"
description = "Interactive frontend and local API bridge for GreenLight-Gym2"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
greenlight = [
  "casadi>=3.6",
  "numpy<2.0",
  "scipy>=1.10",
  "pandas>=2.0",
  "gymnasium>=0.29",
  "PyYAML>=6.0",
  "pytz>=2019.3",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".runtime", ".uv-cache", ".npm-cache", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
