[project]
name = "greenlight-2-simulator"
version = "0.2.0"
description = "Interactive frontend and local API bridge for GreenLight-Gym2"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
greenlight = [
  "casadi>=3.6",
  "numpy<2.0",
  "scipy>=1.10",
  "pandas>=2.0",
  "gymnasium>=0.29",
  "PyYAML>=6.0",
  "pytz>=2019.3",
]
