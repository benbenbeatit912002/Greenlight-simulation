name: Bug report
description: Report reproducible software behavior that differs from the documented contract.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the simulator. Do not include secrets, private greenhouse data, thesis material, or protected research paths.
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Browser approximation
        - GreenLight-Gym2 full model
        - Server or API
        - Documentation or project tooling
        - Unknown
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
      description: Paste the commit SHA, branch, or release identifier.
      placeholder: main at abc1234
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start with ...
        2. Select ...
        3. Run ... steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, browser, Python, Node.js, uv, and model version when relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Add scrubbed logs, screenshots, or a minimal input recipe. Remove tokens and personal paths.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, protected research material, and personal file paths.
          required: true
        - label: This is not a confidential security report; if it is, I will follow SECURITY.md instead.
          required: true
