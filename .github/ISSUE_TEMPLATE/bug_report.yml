name: Bug report
description: Tell us what went wrong and how to reproduce it.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials and confidential data from anything you share. For a security problem, follow [the security guide](https://github.com/benbenbeatit912002/Greenlight-simulation/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: component
    attributes:
      label: Where did it happen?
      options:
        - Installation or startup
        - Weather upload or dates
        - Greenhouse settings
        - Controls or comparisons
        - Full-model simulation
        - Documentation
        - Not sure
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Include the steps or command that led to the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Setup
      description: Operating system, browser, project commit and model version, if known.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
      description: A small example can help. Only attach files you can share publicly.
