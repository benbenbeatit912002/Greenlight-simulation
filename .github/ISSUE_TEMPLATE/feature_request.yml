name: Feature request
description: Suggest an improvement to the simulator.
title: "[Feature] "
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe the task or problem, not just a button or implementation.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: How would it help?
      description: Tell us how you would use it in a simulation.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example or reference
      description: Optional screenshot, paper, example workflow or other context.
