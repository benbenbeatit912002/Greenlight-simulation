name: Model results or validation
description: Discuss a simulation result, comparison with measurements, or calibration experiment.
title: "[Model] "
body:
  - type: markdown
    attributes:
      value: |
        Please distinguish simulated values from measurements. Share only data you have permission to publish.
  - type: textarea
    id: question
    attributes:
      label: What are you checking?
      description: Which output or behavior seems wrong, or which result are you evaluating?
    validations:
      required: true
  - type: input
    id: model_version
    attributes:
      label: Project and model version
      description: Include the project commit and full-model identifier when available.
      placeholder: main at abc1234, gl-gym 0.3.2
  - type: textarea
    id: setup
    attributes:
      label: Simulation setup
      description: Include weather source, dates and clock, greenhouse settings, initial state, controls and commands needed to repeat the run.
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Measurements and calibration
      description: If using measurements, describe their source, units, sampling interval and missing data. Say which periods were used for fitting and which were held out. If no measurements were used, say so.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results and limitations
      description: Include the comparison or error metrics with units, any failed runs, and assumptions that could affect the result.
    validations:
      required: true
