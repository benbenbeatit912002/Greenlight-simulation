name: Security contact request
description: Ask the maintainer to establish a private channel without publishing vulnerability details.
title: "[Security contact] Private reporting channel requested"
body:
  - type: markdown
    attributes:
      value: |
        Use this form only when GitHub private vulnerability reporting is unavailable. Do not include exploit details, credentials, private data, personal paths, or protected research information. The public issue should contain only a request for private contact.
  - type: dropdown
    id: area
    attributes:
      label: General affected area
      options:
        - Local server or API
        - Browser interface
        - Dependency or project configuration
        - Protected-source boundary
        - Other or unknown
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Public-content safety
      options:
        - label: I have not included vulnerability details, credentials, private data, personal paths, or protected research information.
          required: true
        - label: I am requesting only a private reporting channel from the repository owner.
          required: true
