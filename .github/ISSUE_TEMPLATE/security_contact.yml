name: Security contact request
description: Ask how to report a security problem privately.
title: "[Security contact] Request for a private reporting channel"
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Use it only to ask for a private reporting channel. Do not include vulnerability details, credentials or confidential files. If GitHub offers Report a vulnerability on the Security page, use that instead.
  - type: checkboxes
    id: confirmation
    attributes:
      label: Public request
      options:
        - label: I am only requesting a private reporting channel and have not included vulnerability details or sensitive data.
          required: true
